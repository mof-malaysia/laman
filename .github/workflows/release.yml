# Publishes a release: on a pushed tag vX.Y.Z (or vX.Y.Z-beta.N, vX.Y.Z-rc.N),
# builds the Dockerfile for linux/amd64, boots it once (scripts/smoke-image.sh),
# pushes it to ghcr.io/mof-malaysia/laman with an SBOM and provenance, and opens
# a draft GitHub release with compose.yaml and .env.example attached. A person
# edits and publishes the draft; this never does.
#
# No lint, type-check or test jobs: the pre-push hook ran `pnpm verify`.
#
# Run it by hand (Actions > Release > Run workflow) for a dry run: it checks the
# version, builds and boots the image, and pushes and releases nothing.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

# One run per tag; a second push of the same tag waits rather than cancelling.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mof-malaysia/laman

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        if: github.ref_type == 'tag'
        run: |
          root=$(jq -r .version package.json)
          server=$(jq -r .version apps/server/package.json)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$root" ] || [ "$tag" != "$server" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version: package.json has $root, apps/server/package.json has $server"
            exit 1
          fi

      # Every version gets its exact tag (1.0.0, 1.0.0-beta.1). Only a stable
      # version also moves 1.0, 1 and latest; a pre-release (a "-" after the
      # patch number) never does, so `latest` is always a stable release.
      # metadata-action already skips {{major}} and {{major}}.{{minor}} for a
      # pre-release, and `latest=auto` would skip it too; the `enable`
      # conditions say so explicitly rather than relying on those defaults.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - uses: docker/setup-buildx-action@v3

      # Built into the local Docker first, without attestations (which `load`
      # can't carry), so the smoke test runs the image before anything is pushed.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: laman:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: scripts/smoke-image.sh laman:smoke

      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same build again, from the builder's cache, now with the SBOM and
      # provenance attestations, pushed under every tag from metadata-action.
      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max

  release:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            compose.yaml
            .env.example
          sparse-checkout-cone-mode: false

      # A draft, marked as a pre-release for a -beta.N or -rc.N tag. Re-running
      # the workflow for the same tag replaces the attached files on the draft;
      # a release already published is left alone and the run fails.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::Release $tag is already published; not changing it"
              exit 1
            fi
            gh release upload "$tag" compose.yaml .env.example --clobber
            exit 0
          fi
          prerelease=()
          case $tag in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" compose.yaml .env.example \
            --draft --verify-tag --generate-notes --title "Laman ${tag#v}" "${prerelease[@]}"
