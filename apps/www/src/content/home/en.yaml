sovereignty:
  title: And it all stays on your servers
  lead: Laman is installed in the agency's data centre. Only the website you publish goes out to the public, and Laman itself calls no outside service.
  facts:
    - { title: Open source, text: "MIT licence. Read, audit and change the code." }
    - { title: Nothing calls out, text: Works on a network with no internet access. }
    - { title: One Docker image, text: "One process, one SQLite file for content." }
    - { title: Keeps running, text: The static website stays up even with the builder off. }
  more: { label: Read about sovereign technology, href: /en/sovereignty }

