runs:
  title: One Node process. One SQLite file. One Docker image.
  lead: Clone the repository, then run these two commands for the builder with HTTPS. Daily backups run by themselves.
  code: |-
    cp .env.example .env    # fill in the settings
    docker compose --profile https up -d --build
  more: { label: Installation guide, href: /en/install }
