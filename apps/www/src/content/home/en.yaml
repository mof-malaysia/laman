agents:
  title: AI agents can run your website, as the officer.
  lead: Laman is built for AI agents. Its built-in MCP server has about 80 tools, so clients such as Claude or Codex can build and update the website with Laman's own tools, with the permissions of the officer who connected them.
  example: An example, not a recording
  request:
    who: Officer to an AI agent
    text: Set up a new quotation for drain maintenance work, with its documents and a closing date of 30 November.
  steps:
    - { text: Reads the Tenders and quotations listing, tool: list_entries }
    - { text: Writes a new entry as a draft, tool: create_entry }
    - { text: "Uploads the documents from the officer's computer", tool: start_upload }
    - { text: Checks the page before it goes live, tool: check_pages }
  end: { text: Waits for a Content Manager to publish, note: Recorded in the audit log }
  safety:
    - Off until an Admin allows it for a person.
    - "Only that officer's permissions. An Editor's agent can't publish."
    - Every call is recorded in the audit log, and a connection can be cut off.
  data: "What an officer gives an agent goes to the AI provider the agency chooses. Laman itself calls no outside service."
  more: { label: About AI agents in Laman, href: /en/agents }

steps:
  title: Three steps, no code
  lead: Screenshots from the real Laman, with a made-up agency, Jabatan Contoh.
  items:
    - title: Arrange
      text: Start from a template or a blank page, then arrange FTDS blocks on the canvas. Type text straight onto the page, as visitors will see it.
      image: /shots/editor-en.webp
      alt: The Laman editor. On the left, the page structure with four blocks. In the middle, Jabatan Contoh's home page as visitors will see it. On the right, the page settings.
    - title: Check
      text: Before anything goes live, Laman checks the page and says how to fix what it finds. A page with no main heading can't be published at all.
      image: /shots/checks-en.webp
      alt: "The 'Before this page goes live' panel with two items: no main heading, and link text 'Klik sini' that says nothing on its own."
    - title: Publish
      text: Press Publish, or schedule it. Laman writes a static website and swaps out the old version in one step. Every publish is recorded, and can be undone.
      image: /shots/publishing-en.webp
      alt: The Publishing screen. One change ticked to publish, and today's publish history on the right.
  note: The published website is static HTML files. It keeps working even when the builder is switched off.

