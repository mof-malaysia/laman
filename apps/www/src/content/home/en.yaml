# The home page, in English. Structured, because the page is laid out section
# by section; claims here must be in docs/briefs/marketing-site.md's claims list.
title: "Laman: the complete website builder for government agencies"
description: Laman is a website builder for ministries, state governments and local authorities. Everything an agency site needs is built in, with no plugins, and AI agents can run it.
path: /en
alternate: /

hero:
  title: Websites for every citizen.
  lead: The open-source website builder for government agencies.
  primary: { label: Install Laman, href: /en/install }
  secondary: { label: See what's built in, href: "#built-in" }

customers:
  title: For ministries, state governments and local authorities
  items:
    - title: Federal ministries and departments
      text: Many divisions send content, often to a site a vendor built. Laman gives each officer the right role and records who published what.
      features:
        - Editor, Content Manager and Admin roles
        - An audit log, and two-factor that can be required
        - No vendor ticket to change content
    - title: State governments
      text: Every department needs its own site, and they should look alike. Each one is an install of the same Laman, on FTDS.
      features:
        - One Docker image per website, easy to repeat
        - The department's colour, with contrast checked
        - The admin in Bahasa Melayu or English
    - title: Local authorities
      text: "Often one officer runs the site alongside other work, and notices can't wait: assessment tax, road closures, floods."
      features:
        - An announcement on every page, which can be scheduled
        - Undo a publish if something's wrong
        - AI agents can prepare the draft

