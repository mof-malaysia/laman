# The home page, in English. Structured, because the page is laid out section
# by section; claims here must be in docs/briefs/marketing-site.md's claims list.
title: "Laman: the complete website builder for government agencies"
description: Laman is a website builder for ministries, state governments and local authorities. Everything an agency site needs is built in, with no plugins, and AI agents can run it.
path: /en
alternate: /

hero:
  title: From a WhatsApp poster to a page everyone can read.
  lead: Laman is a website builder for ministries, state governments and local authorities. Everything an agency website needs is already built in, with no plugins, and AI agents can run it with the officer's permissions.
  primary: { label: Install Laman, href: /en/install }
  secondary: { label: See what's built in, href: "#built-in" }

stage:
