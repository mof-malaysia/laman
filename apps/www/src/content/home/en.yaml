customers:
  title: For ministries, state governments and local authorities
  items:
    - title: Federal ministries and departments
      text: Many divisions send content, and the website is often built by a vendor. Laman gives every officer the right role, and records who published what.
      features:
        - Editor, Content Manager and Admin roles
        - An audit log, and two-factor that can be required
        - No vendor ticket to change content
    - title: State governments
      text: Every state department needs its own website, with a consistent look. Each website is one install of the same Laman, built on FTDS.
      features:
        - One Docker image per website, easy to repeat
        - The department's colour, with contrast checked
        - The admin in Bahasa Melayu or English
    - title: Local authorities
      text: "Often one officer runs the website on top of other work, and notices have to go out today: assessment tax, road closures, floods."
      features:
        - An announcement on every page, which can be scheduled
        - Undo a publish if something's wrong
        - AI agents can prepare the draft

