  more: { label: Lihat perbandingan penuh dan sumbernya, href: /banding }

agents:
  title: Ejen AI boleh menguruskan laman web anda, sebagai pegawai.
  lead: Laman dibina untuk ejen AI. Pelayan MCP terbina dalamnya mempunyai kira-kira 80 alat, jadi klien seperti Claude atau Codex boleh membina dan mengemas kini laman web menggunakan alat Laman sendiri, dengan kebenaran pegawai yang menyambungkannya.
  example: Contoh, bukan rakaman sebenar
  request:
    who: Pegawai kepada ejen AI
    text: Sediakan sebut harga baharu untuk kerja menyelenggara longkang, dengan dokumennya dan tarikh tutup 30 November.
  steps:
    - { text: Membaca senarai Tender dan sebut harga, tool: list_entries }
    - { text: Menulis entri baharu sebagai draf, tool: create_entry }
    - { text: Memuat naik dokumen dari komputer pegawai, tool: start_upload }
    - { text: Menyemak halaman sebelum terbit, tool: check_pages }
  end: { text: Menunggu Pengurus Kandungan menerbitkan, note: Direkodkan dalam log audit }
  safety:
    - Dimatikan sehingga Pentadbir membenarkannya untuk seseorang.
    - Hanya kebenaran pegawai itu. Ejen seorang Editor tidak boleh menerbitkan.
    - Setiap panggilan direkodkan dalam log audit, dan sambungan boleh diputuskan.
  data: Apa yang pegawai berikan kepada ejen dihantar kepada penyedia AI yang dipilih oleh agensi. Laman sendiri tidak menghubungi mana-mana perkhidmatan luar.
  more: { label: Tentang ejen AI dalam Laman, href: /ejen-ai }

steps:
  title: Tiga langkah, tanpa kod
  lead: Tangkapan skrin daripada Laman sebenar, dengan agensi rekaan, Jabatan Contoh.
  items:
    - title: Susun
      text: Pilih templat atau halaman kosong, kemudian susun blok FTDS di kanvas. Taip teks terus pada halaman, seperti yang akan dilihat pelawat.
      image: /shots/editor-ms.webp
      alt: Penyunting Laman. Di kiri, struktur halaman dengan empat blok. Di tengah, halaman utama Jabatan Contoh seperti yang akan dilihat pelawat. Di kanan, tetapan halaman.
    - title: Semak
      text: Sebelum diterbitkan, Laman memeriksa halaman dan menerangkan cara membetulkannya. Halaman tanpa tajuk utama tidak boleh diterbitkan langsung.
      image: /shots/checks-ms.webp
      alt: "Panel 'Sebelum halaman ini diterbitkan' dengan dua perkara: tiada tajuk utama, dan teks pautan 'Klik sini' yang tidak bermakna dengan sendirinya."
    - title: Terbit
      text: Tekan Terbit, atau jadualkan. Laman menulis laman web statik dan menggantikan versi lama sekali gus. Setiap terbitan direkodkan, dan boleh dibatalkan.
      image: /shots/publishing-ms.webp
      alt: Skrin Penerbitan. Satu perubahan ditanda untuk diterbitkan, dan sejarah terbitan hari ini di sebelah kanan.
  note: Laman web yang diterbitkan ialah fail HTML statik. Ia terus berfungsi walaupun pembina dimatikan.

