# The home page, in BM. Structured, because the page is laid out section by
# section; claims here must be in docs/briefs/marketing-site.md's claims list.
title: "Laman: pembina laman web yang lengkap untuk agensi kerajaan"
description: Laman ialah pembina laman web untuk kementerian, kerajaan negeri dan PBT. Semua yang laman web agensi perlukan terbina dalam, tanpa pemalam, dan ejen AI boleh menguruskannya.
path: /
alternate: /en

hero:
  title: Laman web untuk setiap rakyat.
  lead: Pembina laman web sumber terbuka untuk agensi kerajaan.
  primary: { label: Pasang Laman, href: /pasang }
  secondary: { label: Lihat apa yang terbina dalam, href: "#terbina-dalam" }

customers:
  title: Untuk kementerian, kerajaan negeri dan PBT
  items:
    - title: Kementerian dan jabatan persekutuan
      text: Banyak bahagian menghantar kandungan, dan laman web sering dibina oleh vendor. Laman memberi setiap pegawai peranan yang betul, dan merekodkan siapa menerbitkan apa.
      features:
        - Peranan Editor, Pengurus Kandungan dan Pentadbir
        - Log audit, dan dua faktor yang boleh diwajibkan
        - Tiada tiket vendor untuk menukar kandungan
    - title: Kerajaan negeri
      text: Setiap jabatan negeri memerlukan laman webnya sendiri, dengan rupa yang konsisten. Setiap laman web ialah satu pemasangan Laman yang sama, dibina di atas FTDS.
      features:
        - Satu imej Docker setiap laman web, mudah diulang
        - Warna jabatan, dengan kontras yang disemak
        - Panel pentadbir dalam Bahasa Melayu atau Inggeris
    - title: Pihak berkuasa tempatan
      text: "Selalunya seorang pegawai menguruskan laman web di samping tugas lain, dan notis perlu keluar hari ini: cukai taksiran, penutupan jalan, banjir."
      features:
        - Pengumuman di atas setiap halaman, boleh dijadualkan
        - Batalkan terbitan jika tersilap
        - Ejen AI boleh menyediakan drafnya

