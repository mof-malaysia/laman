runs:
  title: Satu proses Node. Satu fail SQLite. Satu imej Docker.
  lead: Selepas mengklon repositori, dua arahan ini menjalankan pembina bersama HTTPS. Sandaran berjalan setiap hari dengan sendirinya.
  code: |-
    cp .env.example .env    # isi tetapan
    docker compose --profile https up -d --build
  more: { label: Panduan pemasangan, href: /pasang }
