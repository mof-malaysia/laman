  figuresNote: Diukur pada 4 November 2026, pada laman web contoh yang diterbitkan oleh Laman.

sovereignty:
  title: Dan semuanya kekal di pelayan anda
  lead: Laman dipasang di pusat data agensi. Hanya laman web yang anda terbitkan keluar kepada orang awam, dan Laman sendiri tidak menghubungi mana-mana perkhidmatan luar.
  facts:
    - { title: Sumber terbuka, text: "Lesen MIT. Baca, audit dan ubah kodnya." }
    - { title: Tiada sambungan keluar, text: Berfungsi di rangkaian tanpa internet. }
    - { title: Satu imej Docker, text: "Satu proses, satu fail SQLite untuk kandungan." }
    - { title: Terus berjalan, text: Laman web statik kekal walaupun pembina dimatikan. }
  more: { label: Baca tentang teknologi berdaulat, href: /kedaulatan }

