# Laman with Docker Compose, from the published image. Settings go in .env
# beside this file (copy .env.example), including LAMAN_VERSION, the version
# to run. See docs/install-docker.md.
#
#   docker compose pull && docker compose up -d     # behind your own HTTPS proxy
#   docker compose --profile https pull && docker compose --profile https up -d
#                                                   # with Caddy, which gets the certificate itself
#
# Contributors can build the image from this repository instead with
# compose.build.yaml (see the file).
name: laman

services:
  laman:
    # An exact version (1.0.0, 1.0.0-beta.1), set in .env. Upgrading is changing it.
    image: ghcr.io/mof-malaysia/laman:${LAMAN_VERSION:?Set LAMAN_VERSION in .env to the version to run, e.g. 1.0.0}
    restart: unless-stopped
    # Signals reach the server, so a stop finishes the running job and the backup lock is cleared.
    init: true
    env_file: .env
    environment:
      # Fixed by the image layout, so a stray line in .env can't move them.
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_DIR: /data
      BACKUP_DIR: /backups
      # Only a proxy reaches the container (Caddy, or one on this machine
      # through the loopback port), from a Docker private address.
      TRUST_PROXY: ${TRUST_PROXY:-uniquelocal}
      # The bundled media store below. Its keys come from .env and go to both.
      MEDIA_STORE_ENDPOINT: http://rustfs:9000
      MEDIA_STORE_ACCESS_KEY_ID: ${MEDIA_STORE_ACCESS_KEY_ID:?Set MEDIA_STORE_ACCESS_KEY_ID in .env}
      MEDIA_STORE_SECRET_ACCESS_KEY: ${MEDIA_STORE_SECRET_ACCESS_KEY:?Set MEDIA_STORE_SECRET_ACCESS_KEY in .env}
    depends_on:
      rustfs:
        condition: service_healthy
    volumes:
      - data:/data
      # A folder on the host, not a volume: host backup tools (restic) can reach
      # it, and removing the data volume doesn't remove the backups.
      - ${BACKUP_PATH:-./backups}:/backups
    ports:
      # Only this machine: a proxy on the host forwards to it.
      - ${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8080

  # The media library's store: S3-compatible, on the Compose network only, so
  # neither of its buckets is reachable from outside. The builder serves the
  # published files at /media/*. docs/install-docker.md § Media storage.
  rustfs:
    image: rustfs/rustfs:1.0.5
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MEDIA_STORE_ACCESS_KEY_ID:?Set MEDIA_STORE_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${MEDIA_STORE_SECRET_ACCESS_KEY:?Set MEDIA_STORE_SECRET_ACCESS_KEY in .env}
    volumes:
      - media:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  # Optional: HTTPS on 80 and 443 for SITE_URL's host, with a certificate from Let's Encrypt.
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      laman:
        condition: service_healthy
    command: caddy reverse-proxy --from ${SITE_URL:-} --to laman:8080
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy:/data

volumes:
  data:
  media:
  caddy:
