# Build the image from this checkout instead of pulling it: for contributors,
# not installs. Use it on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# The built image is tagged ghcr.io/mof-malaysia/laman:${LAMAN_VERSION}, so set
# LAMAN_VERSION to a name no release uses (LAMAN_VERSION=dev), or the local
# build stands in for the published image of that version.
services:
  laman:
    build: .
    pull_policy: build
