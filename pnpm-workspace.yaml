  "@scalar/fastify-api-reference": "^1.76.2"
  "@tailwindcss/postcss": "^4.3.3"
  "@tanstack/react-query": "^5.105.0"
  "@tanstack/react-router": "^1.170.46"
  "@types/node": "^24.19.2"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@valibot/to-json-schema": "^1.8.0"
  "fastify": "^5.12.7"
  "happy-dom": "^20.14.6"
  "ky": "^2.2.0"
  "lefthook": "^2.2.2"
  "oxfmt": "^0.75.0"
